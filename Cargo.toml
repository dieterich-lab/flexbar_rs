[package]
name = "flexbar_rs"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
log = "0.4"
env_logger = "0.11"
chrono = "0.4"
bio = "2.0.3"
rayon = "1.10"
flate2 = "1.0"
bzip2 = "0.4"
zstd = "0.13"
tempfile = "3.10"

[profile.release]
strip = "symbols"
panic = "abort"
lto = "thin"

