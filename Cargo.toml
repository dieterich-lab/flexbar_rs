[package]
name = "flexbar_rs"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
log = "0.4"
env_logger = "0.11"
chrono = "0.4"
bio = "2.0.3"
rayon = "1.10"
flate2 = "1.0"
bzip2 = "0.4"
zstd = "0.13"
tempfile = "3.10"
thread_local = "1.1"
sigalign = "0.4.1"

[profile.release]
strip = "symbols"
panic = "abort"
lto = "thin"
codegen-units = 1

[target.x86_64-unknown-linux-gnu]
linker = "/usr/bin/clang"
rustflags = ["-Clink-arg=-fuse-ld=lld", "-Clink-arg=-Wl,--no-rosegment"]